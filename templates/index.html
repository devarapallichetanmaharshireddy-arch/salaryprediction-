
<!DOCTYPE html>
<html><head>
<title>Salary Prediction</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
<div class="box">
<h2>Salary Prediction</h2>
<form action="/predict" method="post">
<input type="number" step="0.1" name="age" placeholder="Age" required>
<input type="number" step="0.1" name="experience" placeholder="Years of Experience" required>
<input type="number" step="0.01" name="current_salary" placeholder="Current Salary" required>
<select name="gender">{% for x in gender %}<option>{{x}}</option>{% endfor %}</select>
<select name="education">{% for x in education %}<option>{{x}}</option>{% endfor %}</select>
<select name="job">{% for x in jobs %}<option>{{x}}</option>{% endfor %}</select>
<button type="submit">Predict</button>
</form>
</div>
</body></html>
