
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        .salary {
            font-size: 32px;
            font-weight: bold;
            color: #15803d;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        .error {
            padding: 15px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
        }

        .message {
            color: #475569;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Salary Prediction Result</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% else %}
        <p>Estimated Salary</p>
        <div class="salary">{{ prediction }}</div>
        <p class="message">{{ message }}</p>
        <p>This is an estimate from your trained machine-learning model.</p>
    {% endif %}

    <a href="{{ url_for('home') }}">Back to Home</a>

</div>
</body>
</html>
